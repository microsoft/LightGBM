[workspace]
channels = ["conda-forge"]
name = "lightgbm"
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.10.*"
numpy = "*"

[feature.py310.dependencies]
# direct dependencies
cffi = "1.15.*"
joblib = "1.3.*"
matplotlib-base = "3.7.*"
numpy = "1.22.*"
pandas = "1.3.*"
pyarrow = "16.0.*"
python-graphviz = "0.20.*"
scikit-learn = "1.0.*"
scipy = "1.7.*"

# testing-only packages
cloudpickle = "2.2.*"
h5py = ">=3.10"
ipywidgets = ">=8.1.2"
jupyterlab = "4.5.*"
pip = ">=26"
pluggy = "1.0.*"
psutil = "5.9.3.*"
pytest = "7.4.*"

[environments]
py310 = ["py310"]
